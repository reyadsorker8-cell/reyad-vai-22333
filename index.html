<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARJU AVIATOR HACK</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=JetBrains+Mono:wght@700&display=swap');

:root{
--accent:#ff0055;
--gold:#ffd700;
}

body,html{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:'Poppins',sans-serif;
}

.game-container{
position:absolute;
inset:0;
z-index:1;
}

iframe{
width:100%;
height:100%;
border:none;
}

@keyframes border-glow{
0%{
box-shadow:
0 -10px 20px #ff0000,
10px 0 25px #ff6600,
0 10px 30px #ff3300,
-10px 0 25px #ff0000;
}
25%{
box-shadow:
10px -10px 25px #ff6600,
15px 5px 30px #ff3300,
-5px 15px 25px #ff0000,
-15px -5px 30px #ff6600;
}
50%{
box-shadow:
0 -15px 30px #ff3300,
15px 0 30px #ff0000,
0 15px 30px #ff6600,
-15px 0 30px #ff0000;
}
75%{
box-shadow:
-10px -10px 25px #ff0000,
10px 15px 30px #ff6600,
15px -5px 30px #ff3300,
-5px 10px 25px #ff0000;
}
100%{
box-shadow:
0 -10px 20px #ff0000,
10px 0 25px #ff6600,
0 10px 30px #ff3300,
-10px 0 25px #ff0000;
}
}

@keyframes shine{
0%{background-position:-100px;}
100%{background-position:100px;}
}

@keyframes logo-badge-glow {
0% {
box-shadow: 
0 0 12px #ff0000,
0 0 25px #ff3300,
0 0 40px rgba(255,0,0,0.5);
}
50% {
box-shadow: 
0 0 20px #ff2200,
0 0 40px #ff5500,
0 0 60px rgba(255,50,0,0.7);
}
100% {
box-shadow: 
0 0 12px #ff0000,
0 0 25px #ff3300,
0 0 40px rgba(255,0,0,0.5);
}
}

.tool-box{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
width:220px;
z-index:9999;
touch-action:none;
}

.main-card{
background:linear-gradient(180deg,#1a1a1a,#333);
border-radius:20px;
padding:15px 10px;
text-align:center;
border:3px solid #ff3300;
animation:border-glow 2s infinite linear;
position:relative;
}

.rocket-badge{
position:absolute;
top:-48px;
left:50%;
transform:translateX(-50%);
width:95px;
height:95px;
border-radius:18px;
border:3px solid #ff2200;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#000;
animation:logo-badge-glow 2.2s ease-in-out infinite;
z-index:10;
}

.rocket-badge img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.header-name{
font-size:14px;
margin-top:55px;
margin-bottom:10px;
text-transform:uppercase;
font-weight:900;
background:linear-gradient(90deg,#ffd700,#fff,#ffd700);
background-size:80%;
background-clip:text;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 2s infinite linear;
}

.notice-text{
font-size:11px;
margin-top:8px;
font-weight:bold;
background:linear-gradient(90deg,#ffd700,#fff,#ffd700);
background-size:200%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 2s linear infinite;
}

.ticket-area{
background:#222;
border-radius:12px;
padding:15px 8px;
border:1px solid #444;
}

.prediction-display{
font-size:24px;
font-weight:900;
color:#00ff88;
text-shadow:0 0 15px rgba(0,255,136,0.6);
margin-bottom:5px;
}

.timer-info{
font-family:'JetBrains Mono',monospace;
font-size:10px;
color:#aaa;
border-top:1px solid #444;
padding-top:8px;
}

.btn-group{
display:flex;
gap:5px;
margin-top:10px;
justify-content:center;
}

.btn{
padding:6px 15px;
border-radius:15px;
border:none;
font-weight:900;
font-size:10px;
cursor:pointer;
}

.hide-btn{background:#444;color:#fff;}
.exit-btn{background:var(--accent);color:#fff;}

#login-section{
padding:55px 5px 5px;
}

.input-field{
width:85%;
padding:8px;
border-radius:8px;
border:1px solid var(--accent);
margin-bottom:10px;
text-align:center;
font-size:12px;
font-weight:bold;
background:#000;
color:#fff;
}

.popup-notice{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
border:3px solid #ff3300;
padding:18px;
border-radius:14px;
text-align:center;
font-size:13px;
font-weight:bold;
z-index:10000;
background:linear-gradient(90deg,#ff3300,#ffd700,#ff3300);
background-size:200%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 1.5s linear infinite;
display:none;
}

#mini-icon{
position:fixed;
top:150px;
left:0;
width:40px;
height:40px;
background:var(--accent);
border-radius:0 50% 50% 0;
display:none;
align-items:center;
justify-content:center;
z-index:10000;
box-shadow:0 0 15px var(--accent);
}

</style>
</head>

<div id="login-section">

<input type="password" id="key-input" class="input-field" placeholder="ENTER ACCESS KEY">

<button class="btn" style="background:var(--accent);color:#fff;width:85%;" onclick="startApp()">LOGIN</button>

<div class="notice-text">PREMIUM ARJU HACK</div>

</div>

<div id="main-section" style="display:none;">

<div class="header-name">ARJU AVIATOR HACK</div>

<div class="ticket-area">

<div id="prediction-text" class="prediction-display">WAITING...</div>

<div class="timer-info">
NEXT ROUND IN:
<span id="timer-sec" style="color:var(--gold);font-weight:bold;">30</span>s
</div>

</div>

<div class="btn-group">
<button class="btn hide-btn" onclick="hideBox()">HIDE</button>
<button class="btn exit-btn" onclick="location.reload()">EXIT</button>
</div>

</div>
</div>
</div>

<div id="mini-icon" onclick="showBox()">
<span style="font-size:20px;">✈️</span>
</div>

<div id="noticeBox" class="popup-notice">
৩০ সেকেন্ড শেষ হলে নতুন প্রেডিকশন আসবে<br>
টাইম শেষ হওয়ার আগে কেউ বেট করবেন না
</div>

<script>

function startApp(){

if(document.getElementById("key-input").value==="11220"){

document.getElementById("login-section").style.display="none";
document.getElementById("main-section").style.display="block";

let notice=document.getElementById("noticeBox");

notice.style.display="block";

setTimeout(()=>{

notice.style.display="none";

runAviatorEngine();

},4000);

}else{

alert("WRONG KEY!");

}

}

const box=document.getElementById("dragBox");

let active=false,currentX,currentY,initialX,initialY,xOffset=0,yOffset=0;

box.addEventListener("touchstart",(e)=>{
if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;

initialX=e.touches[0].clientX-xOffset;
initialY=e.touches[0].clientY-yOffset;
active=true;
});

document.addEventListener("touchend",()=>active=false);

document.addEventListener("touchmove",(e)=>{

if(active){

e.preventDefault();

currentX=e.touches[0].clientX-initialX;
currentY=e.touches[0].clientY-initialY;

xOffset=currentX;
yOffset=currentY;

box.style.transform=`translate3d(${currentX}px,${currentY}px,0) translateX(-50%)`;

}

});

function hideBox(){
box.style.display="none";
document.getElementById("mini-icon").style.display="flex";
}

function showBox(){
box.style.display="block";
document.getElementById("mini-icon").style.display="none";
}

function runAviatorEngine(){

function update(){

const now=new Date();
const seconds=now.getSeconds();
const remaining=30-(seconds%30);

if(remaining===30||document.getElementById("prediction-text").innerText==="WAITING..."){

const randomVal=(Math.random()*(4.85-1.10)+1.10).toFixed(2);

document.getElementById("prediction-text").innerText="x"+randomVal;

}

document.getElementById("timer-sec").innerText=remaining;

}

setInterval(update,1000);
update();

}

</script>
